# Neo4j for ProteinChameleon demo
# Start: docker compose up -d
# Stop:  docker compose down
# Wipe data: docker compose down -v
# Browser: http://localhost:7474 (user: neo4j, password: password123)

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
